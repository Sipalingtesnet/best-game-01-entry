<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EMBERFALL</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0b0714;
      color: #f5efe6;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    canvas {
      display: block;
      background-color: #0b0714;
      box-shadow: 0 0 40px rgba(255, 122, 60, 0.2);
    }
    #status {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <p id="status" role="status" aria-live="polite">Loading Emberfall...</p>
  <canvas id="game" aria-label="Emberfall game arena canvas"></canvas>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
